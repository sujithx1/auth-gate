<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        background-color: #09090b !important;
        color: #f4f4f5;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #ffffff !important;
        color: #09090b;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("authgate-theme");
          if (!saved) {
            var match = document.cookie.match(/(?:^|; )authgate_theme=([^;]*)/);
            if (match) saved = match[1];
          }
          var isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches) || !saved;
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
